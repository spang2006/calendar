<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>工作曆與收入管理</title>
  <style>
    :root {
      --primary: #E67E22; --primary-dark: #D35400; --bg: #121212; --card-bg: #1E1E1E;
      --border: #333333; --text: #E0E0E0; --danger: #E74C3C; --mos: #3498DB; --clean: #2ECC71;
      
      --card-padding: 8px;
      --item-margin: 8px;
      --input-padding: 6px;
      
      --card-border-radius: 16px;
      --input-border-radius: 8px;
      
      --base-font-size: 14px;
      --cal-font-size: 11px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 0 auto; background: var(--bg); min-height: 100vh; padding-bottom: 50px; }

    header { display: flex; justify-content: space-between; align-items: center; background: #000; color: var(--primary); padding: 15px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--border); }
    .header-spacer { width: 24px; }
    
    .settings-btn { background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; }
    .settings-btn svg { width: 24px; height: 24px; fill: var(--primary); }

    .toggle-cal-btn { display: flex; justify-content: center; align-items: center; gap: 6px; background: #1a1a1a; padding: 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: bold; color: #aaa; transition: background 0.2s; }
    .toggle-cal-btn:active { background: #2a2a2a; }
    .toggle-cal-btn svg { width: 14px; height: 14px; fill: currentColor; transition: transform 0.3s; }
    .toggle-cal-btn.collapsed svg { transform: rotate(-180deg); }
    
    #calendarWrapper { overflow: hidden; display: block; }
    #calendarWrapper.collapsed { display: none; }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; font-weight: bold; background: var(--card-bg); border-bottom: 1px solid var(--border); font-size: calc(var(--base-font-size) + 1px); }
    .calendar-header button { background: none; border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; color: var(--text); cursor: pointer; font-size: calc(var(--base-font-size) - 1px); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
    .day-name { background: #1a1a1a; text-align: center; padding: 8px 0; font-size: 12px; font-weight: bold; color: #888; }

    .day-cell { background: var(--card-bg); min-height: 65px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .day-cell.active { background: #2A2A2A; box-shadow: inset 0 0 0 1.5px var(--primary); }
    .day-cell.empty { background: #111; }
    .day-date { font-size: 13px; margin-bottom: 2px; color: #aaa; text-align: left; }

    .dots-wrapper { display: flex; gap: 4px; justify-content: center; align-items: center; flex-grow: 1; flex-wrap: wrap; padding: 2px 0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-eng { background-color: var(--primary); }
    .dot-mos { background-color: var(--mos); }
    .dot-clean { background-color: var(--clean); }

    .day-income { font-size: 10px; color: #aaa; text-align: right; border-top: 1px solid var(--border); padding-top: 2px; margin-top: auto; }

    .section-title { font-size: calc(var(--base-font-size) + 1px); font-weight: bold; margin: 20px 20px 10px; border-left: 3px solid var(--primary); padding-left: 8px; color: var(--text); }
    .monthly-total { background: #1a1a1a; color: var(--primary); padding: 12px 20px; font-size: calc(var(--base-font-size) + 1px); font-weight: bold; text-align: center; border-bottom: 1px solid var(--border); }
    .monthly-breakdown { margin-top: 3px; font-size: calc(var(--base-font-size) - 3px); font-weight: normal; color: #888; letter-spacing: 0.3px; }

    .form-group { padding: 8px 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: calc(var(--base-font-size) - 1px); color: #aaa; }
    .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="number"], .form-group select {
      width: 100%; padding: var(--input-padding); background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--input-border-radius); box-sizing: border-box; font-size: calc(var(--base-font-size) + 1px);
    }

    /* 日期選擇標籤樣式 */
    .date-pill { background: var(--primary); color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 13px; display: flex; align-items: center; gap: 6px; font-weight: bold; }
    .date-pill-remove { cursor: pointer; background: rgba(0,0,0,0.2); border-radius: 50%; width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; line-height: 1; transition: background 0.2s; }
    .date-pill-remove:hover { background: rgba(0,0,0,0.5); }

    .item-card { border: 1px solid var(--border); border-radius: var(--card-border-radius); padding: var(--card-padding); margin: 0 20px var(--item-margin); background: var(--card-bg); }
    .item-card.disabled { opacity: 0.4; }
    
    .eng-btn {
      flex: 1; margin: 0; padding: 10px 0; display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--card-border-radius);
    }
    .eng-btn.disabled { opacity: 0.4; }
    .eng-btn input[type="checkbox"] { width: 18px; height: 18px; margin-right: 6px; accent-color: var(--primary); }
    .eng-btn span { font-size: calc(var(--base-font-size) + 1px); font-weight: bold; color: var(--text); }

    .item-details { display: flex; gap: 10px; margin-top: 10px; }
    .item-details > div { flex: 1; }

    .btn-submit { background: var(--primary); color: #fff; border: none; padding: 14px; font-size: calc(var(--base-font-size) + 2px); font-weight: bold; border-radius: var(--card-border-radius); cursor: pointer; flex: 1; }
    .btn-cancel { background: #555; display: none; }

    .record-list { padding: 0 20px; }
    .record-item { background: var(--card-bg); border: 1px solid var(--border); padding: var(--card-padding); border-radius: var(--card-border-radius); margin-bottom: var(--item-margin); position: relative; }
    .record-item p { margin: 4px 0; font-size: calc(var(--base-font-size) - 1px); color: #ccc; }
    .record-title { font-weight: bold; font-size: calc(var(--base-font-size) + 1px) !important; color: var(--primary) !important; padding-right: 90px; }

    .record-actions { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
    .btn-action { color: #fff; border: none; padding: 5px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-edit { background: #3498DB; }
    .btn-delete { background: var(--danger); }

    .daily-summary { padding: 10px 20px; text-align: right; font-weight: bold; font-size: calc(var(--base-font-size) + 1px); color: var(--primary); border-bottom: 1px dashed var(--border); margin-bottom: 20px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 80%; max-width: 320px; border: 1px solid var(--border); }
    .modal-content input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--primary); }

    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999; color: var(--primary);
    }
    .spinner {
      border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%;
      width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="settingsModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px;">版面與外觀設定</h3>
    <div style="padding: 10px 0;">
      <label style="display:flex; justify-content: space-between; color: var(--text); font-size: 14px;">
        <span>紀錄與輸入欄位字型</span>
        <span id="baseFontSizeDisplay">14px</span>
      </label>
      <input type="range" id="baseFontSizeRange" min="8" max="14" value="14" step="1">
    </div>
    <div style="text-align: right; margin-top: 20px;">
      <button class="btn-submit" style="padding: 8px 15px; font-size:14px; flex:none; width:auto;" onclick="closeSettings()">完成</button>
    </div>
  </div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div>PiuPiuPiu...🍔🍔🍔</div>
</div>

<div class="container">
  <header>
    <div class="header-spacer"></div>
    <div>工作曆與收入管理</div>
    <button class="settings-btn" onclick="openSettings()" aria-label="設定">
      <svg viewBox="0 0 24 24">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
      </svg>
    </button>
  </header>

  <div class="toggle-cal-btn" id="toggleCalBtn" onclick="toggleCalendar()">
    <span id="toggleCalText">收合月曆</span>
    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
  </div>

  <div id="calendarWrapper">
    <div class="calendar-header">
      <button id="prevMonth">◀ 上個月</button>
      <span id="monthYearDisplay">2026年 6月</span>
      <button id="nextMonth">下個月 ▶</button>
    </div>
    <div class="calendar-grid">
      <div class="day-name">日</div><div class="day-name">一</div><div class="day-name">二</div>
      <div class="day-name">三</div><div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div>
    </div>
    <div class="calendar-grid" id="calendarDays"></div>
  </div>

  <div class="monthly-total" id="monthlyTotalDisplay">本月累計總收入：$0</div>

  <div class="section-title" id="selectedDateTitle">選擇日期：</div>
  <div class="record-list" id="dailyRecords"></div>
  <div class="daily-summary" id="dailyTotalDisplay">當日總收入：$0</div>

  <div class="section-title">新增 / 編輯紀錄</div>
  
  <div class="form-group">
    <label style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span>選取的日期 (可點擊月曆新增)</span>
      <label id="multiSelectLabel" style="color:var(--primary); display:flex; align-items:center; gap:4px; font-weight:bold; cursor:pointer; font-size:13px; margin:0;">
        <input type="checkbox" id="multiSelectToggle" style="width:auto; margin:0; padding:0;" onchange="toggleMultiSelect()"> 啟用多天同時記錄
      </label>
    </label>
    <div id="selectedDatesDisplay" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
  </div>

  <div class="form-group">
    <label>單號 (選填)</label>
    <input type="text" id="inputOrderNo" placeholder="請輸入接案單號">
  </div>

  <div class="section-title">技師工程</div>
  <div class="form-group">
    <label>預約時間 (24小時制)</label>
    <select id="inputTime">
      <option value="" disabled selected>請選擇時間</option>
    </select>
  </div>
  <div class="form-group">
    <label>施工地點</label>
    <input type="text" id="inputLocation" placeholder="例如：南港、羅斯福路">
  </div>

  <div style="display: flex; gap: 8px; margin: 0 20px var(--item-margin);">
    <label class="eng-btn disabled" id="btnAC">
      <input type="checkbox" id="checkAC" onchange="toggleItem('AC')">
      <span>冷氣</span>
    </label>
    <label class="eng-btn disabled" id="btnWM">
      <input type="checkbox" id="checkWM" onchange="toggleItem('WM')">
      <span>洗衣機</span>
    </label>
    <label class="eng-btn disabled" id="btnCustom">
      <input type="checkbox" id="checkCustom" onchange="toggleItem('Custom')">
      <span>自訂</span>
    </label>
  </div>

  <div class="item-card" id="cardAC" style="display:none;">
    <div style="font-size: calc(var(--base-font-size) - 1px); color: #aaa; margin-bottom: 8px;">冷氣工程細節</div>
    <div class="item-details" id="detailsAC" style="display:flex; margin-top:0;">
      <div><label>數量</label><input type="number" id="qtyAC" min="1" value="1"></div>
      <div>
        <label>薪資來源</label>
        <select id="sourceAC">
          <option value="company">公司 ($1000)</option>
          <option value="private">私下 ($1500)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="item-card" id="cardWM" style="display:none;">
    <div style="font-size: calc(var(--base-font-size) - 1px); color: #aaa; margin-bottom: 8px;">洗衣機工程細節</div>
    <div class="item-details" id="detailsWM" style="display:flex; margin-top:0;">
      <div><label>數量</label><input type="number" id="qtyWM" min="1" value="1"></div>
      <div>
        <label>薪資來源</label>
        <select id="sourceWM">
          <option value="company">公司 ($1000)</option>
          <option value="private">私下 ($1500)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="item-card" id="cardCustom" style="display:none;">
    <div style="font-size: calc(var(--base-font-size) - 1px); color: #aaa; margin-bottom: 8px;">自訂項目細節</div>
    <div class="item-details" id="detailsCustom" style="display:flex; flex-direction:column; gap:10px; margin-top:0;">
      <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>項目名稱</label><input type="text" id="nameCustom" placeholder="例：拉線、洗洞"></div>
        <div style="flex:1;"><label>金額</label><input type="number" id="valCustom" value="0"></div>
      </div>
      <div>
        <label>薪存來源</label>
        <select id="sourceCustom">
          <option value="company">公司</option>
          <option value="private">私下</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section-title">兼職工作</div>
  <div style="display: flex; gap: 8px; margin: 0 20px var(--item-margin);">
    <label class="eng-btn disabled" id="btnMOS">
      <input type="checkbox" id="checkMOS" onchange="toggleItem('MOS')">
      <span>摩斯🍔</span>
    </label>
    <label class="eng-btn disabled" id="btnCleaning">
      <input type="checkbox" id="checkCleaning" onchange="toggleItem('Cleaning')">
      <span>打掃🧹</span>
    </label>
  </div>

  <div class="item-card" id="cardMOS" style="display:none;">
    <div style="font-size: calc(var(--base-font-size) - 1px); color: #aaa; margin-bottom: 8px;">摩斯薪資結算</div>
    <div class="item-details" id="detailsMOS" style="display:flex; margin-top:0;">
      <div><label>當日薪資結算</label><input type="number" id="valMOS" value="588"></div>
    </div>
  </div>

  <div class="item-card" id="cardCleaning" style="display:none;">
    <div style="font-size: calc(var(--base-font-size) - 1px); color: #aaa; margin-bottom: 8px;">打掃紀錄</div>
    <div class="item-details" id="detailsCleaning" style="display:flex; margin-top:0;">
      <div><label>紀錄金額 (預設0，月薪制勿重複加疊)</label><input type="number" id="valCleaning" value="0"></div>
    </div>
  </div>

  <div style="display:flex; gap:10px; margin:15px 20px 30px;">
    <button class="btn-submit" id="btnSubmit" onclick="saveRecord()">儲存紀錄並計算</button>
    <button class="btn-submit btn-cancel" id="btnCancel" onclick="resetForm()">取消編輯</button>
  </div>
</div>

<script>
  // 請確認這裡的 GAS_URL 是你最新部署的網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwqtNhpK12p_lcPHf6rZtXOuZcwfsZIAbXIFA0Uvansf_S4wdNHd4RyLUW7jCuj83Zj/exec";

  let records = [];
  let currentDate = new Date();
  let selectedDateString = formatDate(currentDate);
  let formDates = [selectedDateString]; // 存放表單準備寫入的所有日期
  let editingId = null;
  let editingOriginalYearMonth = null; 
  let isCalendarCollapsed = false;

  const RATE_COMPANY = 1000;
  const RATE_PRIVATE = 1500;

  document.addEventListener('DOMContentLoaded', () => {
    const timeSelect = document.getElementById('inputTime');
    for (let h = 9; h <= 22; h++) {
      ['00', '30'].forEach(m => {
        if (h === 22 && m === '30') return;
        const val = `${String(h).padStart(2, '0')}:${m}`;
        timeSelect.innerHTML += `<option value="${val}">${val}</option>`;
      });
    }

    initSettings();
    renderFormDates(); // 繪製預設日期標籤
    fetchDataFromSheet();
  });

  // ========== 月曆收合功能 ==========
  function toggleCalendar() {
    isCalendarCollapsed = !isCalendarCollapsed;
    const wrapper = document.getElementById('calendarWrapper');
    const btn = document.getElementById('toggleCalBtn');
    const text = document.getElementById('toggleCalText');
    
    if (isCalendarCollapsed) {
      wrapper.classList.add('collapsed');
      btn.classList.add('collapsed');
      text.innerText = "展開月曆";
    } else {
      wrapper.classList.remove('collapsed');
      btn.classList.remove('collapsed');
      text.innerText = "收合月曆";
    }
  }

  // ========== 設定功能 ==========
  function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
  function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
  function initSettings() {
    const savedBaseFontSize = localStorage.getItem('baseFontSize') || '14';
    applyBaseFontSize(savedBaseFontSize);
    const baseFontSizeRange = document.getElementById('baseFontSizeRange');
    baseFontSizeRange.value = savedBaseFontSize;
    baseFontSizeRange.addEventListener('input', e => applyBaseFontSize(e.target.value));
  }
  function applyBaseFontSize(size) {
    document.documentElement.style.setProperty('--base-font-size', size + 'px');
    document.getElementById('baseFontSizeDisplay').innerText = size + 'px';
    localStorage.setItem('baseFontSize', size);
  }

  // ========== 畫面與邏輯輔助 ==========
  function getYearMonthFromDate(dateStr) {
    if (!dateStr) return null;
    const parts = String(dateStr).split('-');
    return parts[0] + "." + Number(parts[1]);
  }

  // 修改：修正原本程式碼中 checkCleaning 對應到舊變數 detailsCleaning 的 Bug
  function toggleItem(type) {
    const isChecked = document.getElementById(`check${type}`).checked;
    if (type === 'AC' || type === 'WM' || type === 'Custom' || type === 'MOS' || type === 'Cleaning') {
      document.getElementById(`btn${type}`).classList.toggle('disabled', !isChecked);
      document.getElementById(`card${type}`).style.display = isChecked ? 'block' : 'none';
    } else {
      document.getElementById(`details${type}`).style.display = isChecked ? 'flex' : 'none';
      document.getElementById(`card${type}`).classList.toggle('disabled', !isChecked);
    }
  }

  function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // 渲染表單上的日期標籤 (Pills)
  function renderFormDates() {
    const container = document.getElementById('selectedDatesDisplay');
    container.innerHTML = '';
    formDates.forEach(d => {
      // 只要超過 1 天且不是在編輯模式，就允許刪除特定日期
      const canRemove = (formDates.length > 1 && !editingId);
      container.innerHTML += `
        <div class="date-pill">
          ${d}
          ${canRemove ? `<div class="date-pill-remove" onclick="removeFormDate('${d}', event)">×</div>` : ''}
        </div>
      `;
    });
  }

  // 從多選清單中移除特定日期
  function removeFormDate(d, e) {
    e.stopPropagation();
    formDates = formDates.filter(date => date !== d);
    if (formDates.length === 0) {
      formDates = [selectedDateString];
      document.getElementById('multiSelectToggle').checked = false;
    } else {
      selectedDateString = formDates[formDates.length - 1]; 
    }
    renderCalendar();
    renderFormDates();
    updateDailyView();
  }

  // 切換「啟用多天同時記錄」開關
  function toggleMultiSelect() {
    if (!document.getElementById('multiSelectToggle').checked) {
      // 如果關閉多選，保留最後一次點擊的日期即可
      if (formDates.length > 1) {
        formDates = [formDates[formDates.length - 1]];
        selectedDateString = formDates[0];
      }
    }
    renderCalendar();
    renderFormDates();
  }

  // ========== 主資料抓取與渲染（本機快取 + 背景更新）==========
  // 快取策略：
  // 1. 先從 localStorage 讀出該月舊資料，立刻渲染畫面（幾乎 0 秒，不卡 loading）。
  // 2. 同時在背景向伺服器要最新資料，回來後若有變化才悄悄刷新並更新快取。
  // 3. 完全沒有快取時（第一次看某月），才顯示全屏 loading 等待。
  // 前端排序：先日期、同日內按時間從早到晚（與後端一致）
  function recordTimeMinutes(r) {
    let t = String((r && r.time) || '').trim();
    let m = t.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) {
      const item = String((r && r.itemString) || '');
      m = item.match(/(\d{1,2}):(\d{2})/);
    }
    if (m) {
      const h = Number(m[1]), min = Number(m[2]);
      if (!isNaN(h) && !isNaN(min)) return h * 60 + min;
    }
    return 24 * 60 + 1; // 沒時間排當天最後
  }

  function sortRecords() {
    records.sort((a, b) => {
      if (a.date < b.date) return -1;
      if (a.date > b.date) return 1;
      return recordTimeMinutes(a) - recordTimeMinutes(b);
    });
  }

  // 任何本地變動後呼叫：重新排序、重繪、並把目前顯示月份寫回本機快取
  function applyLocalChange() {
    sortRecords();
    renderCalendar();
    updateDailyView();
    const y = currentDate.getFullYear();
    const mo = currentDate.getMonth() + 1;
    saveLocalRecords(y, mo, records);
  }

  function getCacheKeyLocal(year, month) {
    return `records_cache_${year}_${month}`;
  }

  function loadLocalRecords(year, month) {
    try {
      const raw = localStorage.getItem(getCacheKeyLocal(year, month));
      if (!raw) return null;
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : null;
    } catch (e) {
      return null;
    }
  }

  function saveLocalRecords(year, month, data) {
    try {
      localStorage.setItem(getCacheKeyLocal(year, month), JSON.stringify(data));
    } catch (e) {
      // 容量滿或隱私模式：忽略，不影響功能
    }
  }

  async function fetchDataFromSheet() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth() + 1;

    // 步驟一：先用本機快取即時顯示
    const cached = loadLocalRecords(year, month);
    const hasCache = cached !== null;
    if (hasCache) {
      records = cached;
      renderCalendar();
      updateDailyView();
      // 有快取：不擋畫面，背景靜默更新
      document.getElementById('loadingOverlay').style.display = 'none';
    } else {
      // 沒快取：第一次看這個月，顯示 loading
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    // 步驟二：背景向伺服器要最新資料
    try {
      const res = await fetch(`${GAS_URL}?year=${year}&month=${month}`);
      const data = await res.json();
      const fresh = Array.isArray(data) ? data : [];

      // 只有當伺服器資料與目前顯示不同時才重繪，避免無謂閃動
      const changed = JSON.stringify(fresh) !== JSON.stringify(records);
      records = fresh;
      saveLocalRecords(year, month, fresh);

      // 確認使用者還停留在同一個月才重繪（避免背景回來時已切月）
      if (currentDate.getFullYear() === year && (currentDate.getMonth() + 1) === month) {
        if (changed || !hasCache) {
          renderCalendar();
          updateDailyView();
        }
      }
    } catch (err) {
      console.error("同步失敗", err);
      // 有快取時連線失敗：靜默沿用快取，不打擾使用者
      if (!hasCache) {
        alert("無法讀取伺服器資料，請確認連線狀態。");
        records = [];
        renderCalendar();
        updateDailyView();
      }
    } finally {
      document.getElementById('loadingOverlay').style.display = 'none';
    }
  }

  // 點擊月曆格子時的行為判斷
  function selectDate(dateStr) {
    const isMultiMode = document.getElementById('multiSelectToggle').checked;

    if (isMultiMode && !editingId) {
      // 多選模式：若已存在則移除（前提是大於1天），若不存在則加入
      if (formDates.includes(dateStr)) {
        if (formDates.length > 1) {
          formDates = formDates.filter(d => d !== dateStr);
          selectedDateString = formDates[formDates.length - 1]; // 下方清單切換到最後一個選取的日子
        }
      } else {
        formDates.push(dateStr);
        formDates.sort(); // 保持日期排序
        selectedDateString = dateStr;
      }
    } else {
      // 單選模式或編輯模式：直接覆蓋
      formDates = [dateStr];
      selectedDateString = dateStr;
    }

    renderCalendar();
    renderFormDates();
    updateDailyView();
  }

  // 更新：更新 renderCalendar 邏輯，自動根據月份加入打掃月薪加總
  function renderCalendar() {
    const currentYear = currentDate.getFullYear();
    const currentMonthIndex = currentDate.getMonth(); 
    const displayMonth = currentMonthIndex + 1; 

    document.getElementById('monthYearDisplay').innerText = `${currentYear}年 ${displayMonth}月`;

    const firstDay = new Date(currentYear, currentMonthIndex, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
    const calendarDays = document.getElementById('calendarDays');
    calendarDays.innerHTML = '';

    let currentMonthTotal = 0;
    let hasCleaningThisMonth = false; // 用來追蹤當月是否包含任何打掃行程
    // 分類累加：用於下方明細顯示
    let sumCompany = 0, sumPrivate = 0, sumMos = 0, sumCleaning = 0;

    for (let i = 0; i < firstDay; i++) {
      calendarDays.innerHTML += `<div class="day-cell empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(displayMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dailyRecords = records.filter(r => r.date === dateStr);
      const dailyIncome = dailyRecords.reduce((sum, r) => sum + (Number(r.totalIncome) || 0), 0);
      currentMonthTotal += dailyIncome;

      dailyRecords.forEach(r => {
        sumCompany  += Number(r.companyIncome) || 0;
        sumPrivate  += Number(r.privateIncome) || 0;
        sumMos      += Number(r.mos) || 0;
        sumCleaning += Number(r.cleaning) || 0;
      });

      let hasEng = false;
      let hasMos = false;
      let hasClean = false;

      dailyRecords.forEach(r => {
        if (r.acQty > 0 || r.wmQty > 0 || r.customName) hasEng = true;
        if (r.mos > 0) hasMos = true;
        if (r.cleaning > 0 || String(r.itemString || '').indexOf("打掃") !== -1) {
          hasClean = true;
          hasCleaningThisMonth = true; 
        }
      });

      let dotsHtml = '<div class="dots-wrapper">';
      if (hasEng) dotsHtml += '<div class="status-dot dot-eng"></div>';
      if (hasMos) dotsHtml += '<div class="status-dot dot-mos"></div>';
      if (hasClean) dotsHtml += '<div class="status-dot dot-clean"></div>';
      dotsHtml += '</div>';

      // 只要日期包含在 formDates 陣列中，格子就會亮起
      const isActive = formDates.includes(dateStr) ? 'active' : '';
      const incomeHtml = dailyIncome > 0 ? `<div class="day-income">$${dailyIncome}</div>` : '';

      calendarDays.innerHTML += `
        <div class="day-cell ${isActive}" onclick="selectDate('${dateStr}')">
          <div class="day-date">${day}</div>
          ${dotsHtml}
          ${incomeHtml}
        </div>
      `;
    }

    // 當月有打掃行程時，動態判斷分水嶺月薪加入總收入
    if (hasCleaningThisMonth) {
      const isAfterJuly = (currentYear > 2026) || (currentYear === 2026 && displayMonth >= 7);
      const cleaningMonthlySalary = isAfterJuly ? 14500 : 7500;
      currentMonthTotal += cleaningMonthlySalary;
      sumCleaning += cleaningMonthlySalary; // 打掃月薪併入打掃分類明細
    }

    // 產生分類明細（只顯示有金額的類別）
    const breakdownParts = [];
    if (sumCompany  > 0) breakdownParts.push(`公司 $${sumCompany}`);
    if (sumPrivate  > 0) breakdownParts.push(`私下 $${sumPrivate}`);
    if (sumMos      > 0) breakdownParts.push(`摩斯 $${sumMos}`);
    if (sumCleaning > 0) breakdownParts.push(`打掃 $${sumCleaning}`);
    const breakdownHtml = breakdownParts.length
      ? `<div class="monthly-breakdown">${breakdownParts.join('｜')}</div>`
      : '';

    document.getElementById('monthlyTotalDisplay').innerHTML =
      `本月累計總收入：$${currentMonthTotal}${breakdownHtml}`;
  }

  function updateDailyView() {
    document.getElementById('selectedDateTitle').innerText = `紀錄清單 (${selectedDateString})`;
    const listContainer = document.getElementById('dailyRecords');
    const dailyRecords = records.filter(r => r.date === selectedDateString);

    listContainer.innerHTML = '';
    let dailyTotal = 0;

    if (dailyRecords.length === 0) {
      listContainer.innerHTML = '<p style="text-align:center; color:#666;">當日尚無紀錄</p>';
    } else {
      dailyRecords.forEach(r => {
        dailyTotal += Number(r.totalIncome) || 0;
        listContainer.innerHTML += `
          <div class="record-item">
            <div class="record-actions">
              <button class="btn-action btn-edit" onclick="editRecord('${String(r.id)}')">編輯</button>
              <button class="btn-action btn-delete" onclick="deleteRecord('${String(r.id)}')">刪除</button>
            </div>
            <p class="record-title">${r.itemString}</p>
            <p>單號：${r.orderNo || '無'}</p>
            <p>總計：$${r.totalIncome} (工程:$${(Number(r.companyIncome) || 0) + (Number(r.privateIncome) || 0)}, 摩斯:$${Number(r.mos) || 0}, 打掃:$${Number(r.cleaning) || 0})</p>
          </div>
        `;
      });
    }

    document.getElementById('dailyTotalDisplay').innerText = `當日總收入：$${dailyTotal}`;
  }

  // ========== 編輯與重設功能 ==========
  function editRecord(id) {
    const r = records.find(x => String(x.id) === String(id));
    if (!r) return;

    editingId = String(r.id);
    // originalYearMonth 一律以「紀錄實際日期」推算，避免沿用可能過期的舊值
    editingOriginalYearMonth = getYearMonthFromDate(r.date);

    resetForm(false); 
    
    // 進入編輯模式時，強制關閉並隱藏多選按鈕
    document.getElementById('multiSelectToggle').checked = false;
    document.getElementById('multiSelectLabel').style.display = 'none';
    formDates = [r.date];
    selectedDateString = r.date;
    renderFormDates();
    renderCalendar();

    document.getElementById('btnSubmit').scrollIntoView({ behavior: 'smooth', block: 'end' });
    document.getElementById('btnSubmit').innerText = "更新紀錄並計算";
    document.getElementById('btnSubmit').style.background = "#3498DB";
    document.getElementById('btnCancel').style.display = "block";

    document.getElementById('inputOrderNo').value = r.orderNo || '';
    document.getElementById('inputTime').value = r.time || '';
    document.getElementById('inputLocation').value = r.location || '';

    if (r.acQty > 0) { document.getElementById('checkAC').checked = true; toggleItem('AC'); document.getElementById('qtyAC').value = r.acQty; document.getElementById('sourceAC').value = r.acSource || 'company'; }
    if (r.wmQty > 0) { document.getElementById('checkWM').checked = true; toggleItem('WM'); document.getElementById('qtyWM').value = r.wmQty; document.getElementById('sourceWM').value = r.wmSource || 'company'; }
    if (r.customVal > 0 || r.customName) { document.getElementById('checkCustom').checked = true; toggleItem('Custom'); document.getElementById('nameCustom').value = r.customName || ''; document.getElementById('valCustom').value = r.customVal || 0; document.getElementById('sourceCustom').value = r.customSource || 'company'; }
    if (r.mos > 0) { document.getElementById('checkMOS').checked = true; toggleItem('MOS'); document.getElementById('valMOS').value = r.mos; }
    if (r.cleaning > 0 || String(r.itemString || '').includes('打掃')) { document.getElementById('checkCleaning').checked = true; toggleItem('Cleaning'); document.getElementById('valCleaning').value = r.cleaning || 0; }
  }

  function resetForm(fullReset = true) {
    // ★關鍵修正：只有「完整重設」(如取消編輯、儲存完成)才清掉編輯狀態。
    //   editRecord 內部會呼叫 resetForm(false) 來清空表單欄位，
    //   若在此無條件清掉 editingId，會導致編輯完按儲存時被誤判為新增，
    //   進而產生一筆重複資料（舊資料未被覆寫）。
    if (fullReset) {
      editingId = null;
      editingOriginalYearMonth = null;
    }

    document.getElementById('btnSubmit').innerText = "儲存紀錄並計算";
    document.getElementById('btnSubmit').style.background = "var(--primary)";
    document.getElementById('btnCancel').style.display = "none";

    // 恢復顯示多選開關，並確保取消勾選
    document.getElementById('multiSelectLabel').style.display = 'flex';
    document.getElementById('multiSelectToggle').checked = false;
    
    if (fullReset) {
      formDates = [selectedDateString];
      renderFormDates();
      renderCalendar();
    }

    document.getElementById('inputOrderNo').value = '';
    document.getElementById('inputTime').value = '';
    document.getElementById('inputLocation').value = '';

    ['AC', 'WM', 'Custom', 'MOS', 'Cleaning'].forEach(type => {
      document.getElementById(`check${type}`).checked = false;
      toggleItem(type);
    });

    document.getElementById('qtyAC').value = 1;
    document.getElementById('qtyWM').value = 1;
    document.getElementById('nameCustom').value = '';
    document.getElementById('valCustom').value = 0;
    document.getElementById('valMOS').value = 588;
    document.getElementById('valCleaning').value = 0;
    document.getElementById('sourceAC').value = 'company';
    document.getElementById('sourceWM').value = 'company';
    document.getElementById('sourceCustom').value = 'company';
  }

  // ========== 儲存與刪除 ==========
  async function saveRecord() {
    if (formDates.length === 0) { alert("請點擊月曆選取至少一個日期"); return; }
    const orderNo = document.getElementById('inputOrderNo').value.trim();
    const time = document.getElementById('inputTime').value;
    const location = document.getElementById('inputLocation').value.trim();

    const hasAC = document.getElementById('checkAC').checked;
    const hasWM = document.getElementById('checkWM').checked;
    const hasCustom = document.getElementById('checkCustom').checked;
    const hasMOS = document.getElementById('checkMOS').checked;
    const hasCleaning = document.getElementById('checkCleaning').checked;

    if (!hasAC && !hasWM && !hasCustom && !hasMOS && !hasCleaning) {
      alert("請至少選擇一項工作");
      return;
    }
    if ((hasAC || hasWM || hasCustom) && (!time || !location)) {
      alert("工程案件請選擇時間並填寫地點");
      return;
    }

    const recordsToSave = [];
    const isEdit = !!editingId;
    const dates = [...formDates]; // 複製當前選取的日期陣列

    for (let i = 0; i < dates.length; i++) {
      const date = dates[i];
      let acQty = 0, wmQty = 0, customVal = 0, companyIncome = 0, privateIncome = 0, mosIncome = 0, cleaningIncome = 0;
      let acSource = "company", wmSource = "company", customSource = "company";
      let customName = "";
      let itemStringParts = [];

      if (hasAC || hasWM || hasCustom) {
        itemStringParts.push(time);
        itemStringParts.push(location);
        if (hasAC) {
          acQty = parseInt(document.getElementById('qtyAC').value, 10) || 0;
          acSource = document.getElementById('sourceAC').value;
          const income = acSource === 'company' ? acQty * RATE_COMPANY : acQty * RATE_PRIVATE;
          if (acSource === 'company') companyIncome += income; else privateIncome += income;
          itemStringParts.push(`冷氣${acQty}`);
        }
        if (hasWM) {
          wmQty = parseInt(document.getElementById('qtyWM').value, 10) || 0;
          wmSource = document.getElementById('sourceWM').value;
          const income = wmSource === 'company' ? wmQty * RATE_COMPANY : wmQty * RATE_PRIVATE;
          if (wmSource === 'company') companyIncome += income; else privateIncome += income;
          itemStringParts.push(`洗衣機${wmQty}`);
        }
        if (hasCustom) {
          customName = document.getElementById('nameCustom').value.trim() || "特殊項目";
          customVal = parseInt(document.getElementById('valCustom').value, 10) || 0;
          customSource = document.getElementById('sourceCustom').value;
          if (customSource === 'company') companyIncome += customVal; else privateIncome += customVal;
          itemStringParts.push(customName);
        }
      }

      if (hasMOS) {
        mosIncome = parseInt(document.getElementById('valMOS').value, 10) || 0;
        itemStringParts.push("21:30 摩斯打烊班");
      }

      if (hasCleaning) {
        // 月薪制防呆：若多天選取，只在「第一筆」紀錄打掃金額
        cleaningIncome = (i === 0) ? (parseInt(document.getElementById('valCleaning').value, 10) || 0) : 0;
        let cleanTime = time ? time : "10:00"; 
        itemStringParts.push(`${cleanTime} 打掃`);
      }

      const totalIncome = companyIncome + privateIncome + mosIncome + cleaningIncome;
      const newYM = getYearMonthFromDate(date);

      recordsToSave.push({
        id: isEdit ? String(editingId) : Date.now().toString() + "_" + i,
        date,
        orderNo,
        time,
        location,
        acQty,
        wmQty,
        acSource,
        wmSource,
        customName,
        customVal,
        customSource,
        companyIncome,
        privateIncome,
        mos: mosIncome,
        cleaning: cleaningIncome,
        totalIncome,
        itemString: itemStringParts.join(' '),
        originalYearMonth: isEdit ? editingOriginalYearMonth : newYM
      });
    }

    // ===== 樂觀更新（Optimistic Update）=====
    // 不再等伺服器回應才更新畫面。按下儲存的瞬間就：
    //   1. 立刻把資料寫進記憶體 + 本機快取 + 重繪（使用者 0 秒看到結果）
    //   2. 重設表單，可馬上記下一筆
    //   3. 背景把資料送往伺服器，不擋畫面
    //   4. 送出失敗才跳提示，並把該筆標記為「未同步」

    // 先在記憶體即時套用
    if (isEdit) {
      const idx = records.findIndex(r => String(r.id) === String(editingId));
      if (idx !== -1) {
        records[idx] = { ...recordsToSave[0], originalYearMonth: getYearMonthFromDate(recordsToSave[0].date), _pending: true };
      } else {
        records.push({ ...recordsToSave[0], originalYearMonth: getYearMonthFromDate(recordsToSave[0].date), _pending: true });
      }
    } else {
      recordsToSave.forEach(r => {
        records.push({ ...r, originalYearMonth: getYearMonthFromDate(r.date), _pending: true });
      });
    }

    // 記下這次操作所需的資訊，供背景送出與切月判斷使用
    const op = {
      isEdit,
      recordsToSave,
      editingOriginalYearMonth,
      targetDate: dates[0]
    };

    // 立即重設表單與畫面（使用者可馬上輸入下一筆）
    selectedDateString = dates[0];
    resetForm(true);

    const inputDateObj = new Date(dates[0]);
    const needSwitchMonth = (
      inputDateObj.getMonth() !== currentDate.getMonth() ||
      inputDateObj.getFullYear() !== currentDate.getFullYear() ||
      (isEdit && op.editingOriginalYearMonth && op.editingOriginalYearMonth !== getYearMonthFromDate(dates[0]))
    );

    if (needSwitchMonth) {
      // 跨月：先切到目標月並用本機快取即時顯示（fetchDataFromSheet 會背景補抓）
      currentDate = inputDateObj;
    }
    applyLocalChange();

    // 背景送往伺服器，不 await、不擋畫面
    syncInBackground(op);
  }

  // 背景同步：把樂觀更新的資料實際送往伺服器，失敗才提示
  async function syncInBackground(op) {
    let ok = false;
    try {
      if (op.isEdit) {
        ok = await syncToSheet('edit', op.recordsToSave[0]);
      } else if (op.recordsToSave.length === 1) {
        ok = await syncToSheet('add', op.recordsToSave[0]);
      } else {
        ok = await syncToSheet('batchAdd', null, op.recordsToSave);
      }
    } catch (e) {
      ok = false;
    }

    const ids = op.recordsToSave.map(r => String(r.id));

    if (ok) {
      // 成功：清掉 _pending 標記並更新快取
      records.forEach(r => { if (ids.includes(String(r.id))) delete r._pending; });
      const y = currentDate.getFullYear();
      const mo = currentDate.getMonth() + 1;
      saveLocalRecords(y, mo, records);
      // 不重繪也可以（標記是隱形的）；若你想讓「未同步」有視覺差異，可改為 renderCalendar()
    } else {
      // 失敗：把樂觀加入的資料回滾，提示使用者重試
      if (op.isEdit) {
        // 編輯失敗：保留資料但標記未同步，避免使用者輸入消失
        alert('這筆編輯沒有成功上傳到伺服器，請稍後重新編輯一次。');
      } else {
        // 新增失敗：移除剛剛樂觀加入的資料，避免顯示一筆其實沒存上的紀錄
        records = records.filter(r => !ids.includes(String(r.id)));
        const y = currentDate.getFullYear();
        const mo = currentDate.getMonth() + 1;
        saveLocalRecords(y, mo, records);
        renderCalendar();
        updateDailyView();
        alert('這筆紀錄沒有成功上傳到伺服器，請確認連線後重新輸入。');
      }
    }
  }

  async function deleteRecord(id) {
    const recordToDelete = records.find(r => String(r.id) === String(id));
    if (!recordToDelete) return;

    // 樂觀更新：立即從畫面移除
    const backup = { ...recordToDelete };
    records = records.filter(r => String(r.id) !== String(id));
    applyLocalChange();
    resetForm(true);

    // 背景送出刪除，失敗才把資料還原
    const ok = await syncToSheet('delete', recordToDelete);
    if (!ok) {
      records.push(backup);
      applyLocalChange();
      alert('刪除沒有成功上傳到伺服器，已還原這筆紀錄，請稍後重試。');
    }
  }

  document.getElementById('prevMonth').addEventListener('click', async () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    await fetchDataFromSheet();
  });

  document.getElementById('nextMonth').addEventListener('click', async () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    await fetchDataFromSheet();
  });

  async function syncToSheet(action, record, batchRecords = null) {
    // 純粹負責送出，不控制畫面 loading、不自行 alert。
    // 成敗由呼叫端（樂觀更新流程）決定如何處理。
    try {
      const payload = { action };
      if (action === 'batchAdd') {
        payload.records = batchRecords;
      } else {
        payload.record = record;
        payload.originalYearMonth = record.originalYearMonth || getYearMonthFromDate(record.date);
      }

      const res = await fetch(GAS_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });

      const text = await res.text();
      let data = {};
      try {
        data = JSON.parse(text);
      } catch (e) {
        return false;
      }

      return data.status === 'success';
    } catch (err) {
      console.error('寫入失敗:', err);
      return false;
    }
  }
</script>
</body>
